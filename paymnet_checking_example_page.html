<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - Support Our Mission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .hero-gradient { background: radial-gradient(circle at top right, #f8fafc 0%, #ffffff 100%); }
        
        #notification {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            visibility: hidden;
        }
        #notification.show { transform: translateY(0); visibility: visible; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">

    <!-- Custom Notification -->
    <div id="notification" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] w-full max-w-md px-4 pointer-events-none">
        <div id="notif-bg" class="bg-slate-900 text-white p-5 rounded-2xl shadow-2xl flex items-start space-x-4 pointer-events-auto border border-white/10">
            <div id="notif-icon" class="w-10 h-10 shrink-0 rounded-full flex items-center justify-center bg-blue-500 text-white font-bold">
                !
            </div>
            <div class="flex-1">
                <p id="notif-msg" class="text-sm font-medium leading-relaxed">Processing...</p>
            </div>
            <button onclick="hideNotification()" class="text-slate-400 hover:text-white shrink-0">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <section class="hero-gradient min-h-screen flex items-center py-20">
        <div class="max-w-6xl mx-auto px-4 grid lg:grid-cols-2 gap-16 items-center">
            
            <div class="space-y-8 text-center lg:text-left">
                <div class="inline-flex items-center space-x-2 px-3 py-1 text-xs font-semibold text-emerald-600 bg-emerald-50 rounded-full">
                    <span>LIVE PORTAL: SVTC FOUNDATION</span>
                </div>
                <h1 class="text-4xl md:text-6xl font-bold leading-tight">
                    Every Rupee <br><span class="text-blue-600">Makes Impact.</span>
                </h1>
                <p class="text-lg text-slate-600 leading-relaxed">
                    If you see "Connecting to Gateway" for too long, ensure your browser is not blocking popups and you are on <b>https://www.svtc.life</b>.
                </p>
            </div>

            <!-- Donation Card -->
            <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl border border-slate-100 relative">
                <form id="donationForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-700">Donation Amount (₹)</label>
                        <input type="number" id="amount" name="amount" placeholder="Minimum ₹1" required min="1"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 outline-none font-bold text-lg focus:ring-2 focus:ring-blue-500 transition">
                    </div>

                    <div class="space-y-4">
                        <input type="text" name="name" placeholder="Full Name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 outline-none">
                        <input type="email" name="email" placeholder="Email Address" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 outline-none">
                        <input type="tel" name="phone" placeholder="Mobile Number" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 outline-none">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-5 rounded-2xl transition shadow-xl disabled:bg-slate-300">
                        Donate via Razorpay
                    </button>
                </form>

                <div id="loading" class="hidden absolute inset-0 bg-white/95 z-20 flex flex-col items-center justify-center text-center p-6 rounded-[2.5rem]">
                    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="font-bold text-blue-600" id="loadingText">Connecting to Gateway...</p>
                    <button onclick="location.reload()" class="mt-4 text-xs text-blue-600 underline">Refresh & Try Again</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Essential Razorpay Library -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" onerror="alert('Razorpay library failed to load. Check your internet or ad-blocker.')"></script>
    
    <script>
        // API CONFIGURATION
        const RAZORPAY_KEY = "rzp_live_RYLfVWwqlbtIE"; 
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwOVQBCgUpvpU5wuIbcZKFdg91wB0T-wntqdepl-9MZHufzg5CN-uY_sMIkqUmZXKFK/exec";

        const notif = document.getElementById('notification');
        const notifMsg = document.getElementById('notif-msg');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');

        function showNotification(msg, type = 'info') {
            notifMsg.innerHTML = msg;
            notif.classList.add('show');
            const iconWrap = document.getElementById('notif-icon');
            
            if(type === 'error') {
                iconWrap.className = "w-10 h-10 shrink-0 rounded-full flex items-center justify-center bg-red-500 text-white font-bold";
                iconWrap.innerHTML = "!";
            } else {
                iconWrap.className = "w-10 h-10 shrink-0 rounded-full flex items-center justify-center bg-emerald-500 text-white font-bold";
                iconWrap.innerHTML = "✓";
            }
            setTimeout(hideNotification, 10000);
        }

        function hideNotification() { notif.classList.remove('show'); }

        document.getElementById('donationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Diagnostics
            if (typeof Razorpay === 'undefined') {
                showNotification("<b>Error:</b> Razorpay library not loaded. Please disable Ad-blockers or try another browser.", "error");
                return;
            }

            loading.classList.remove('hidden');
            loadingText.innerText = "Connecting to Gateway...";
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const paiseAmount = Math.round(parseFloat(data.amount) * 100);

            // Log attempt
            fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ type: 'attempt', ...data }) }).catch(()=>{});

            const options = {
                "key": RAZORPAY_KEY,
                "amount": paiseAmount,
                "currency": "INR",
                "name": "SVTC Foundation",
                "description": "Donation for Social Cause",
                "image": "https://www.svtc.life/favicon.ico", // Optional logo
                "handler": function (response) {
                    loadingText.innerText = "Payment Success! Saving data...";
                    showNotification("Payment Successful! Saving to Sheet.", "success");
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ 
                            type: 'success', 
                            payment_id: response.razorpay_payment_id,
                            ...data 
                        })
                    }).then(() => {
                        setTimeout(() => window.location.reload(), 3000);
                    });
                },
                "modal": { 
                    "ondismiss": () => {
                        loading.classList.add('hidden');
                        showNotification("Payment was cancelled or closed.", "info");
                    },
                    "escape": false
                },
                "prefill": { 
                    "name": data.name, 
                    "email": data.email, 
                    "contact": data.phone 
                },
                "theme": { "color": "#2563eb" },
                "retry": { "enabled": false }
            };

            // Safety timeout: If gateway doesn't open in 8 seconds
            const gatewayTimeout = setTimeout(() => {
                if (!document.querySelector('.razorpay-container')) {
                    loading.classList.add('hidden');
                    showNotification("<b>Timeout:</b> Gateway is taking too long. Possible reasons:<br>1. Domain not verified.<br>2. Razorpay Dashboard needs more business details.<br>3. Internet issues.", "error");
                }
            }, 8000);

            try {
                const rzp = new Razorpay(options);
                
                rzp.on('payment.failed', function (resp) {
                    clearTimeout(gatewayTimeout);
                    loading.classList.add('hidden');
                    showNotification("<b>Payment Failed:</b> " + resp.error.description + "<br>Reason: " + resp.error.reason, "error");
                });

                rzp.open();
                
            } catch (err) {
                clearTimeout(gatewayTimeout);
                loading.classList.add('hidden');
                showNotification("<b>Critical Error:</b> " + err.message, "error");
                console.error(err);
            }
        });
    </script>
</body>
</html>
